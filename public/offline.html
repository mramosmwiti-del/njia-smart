<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline</title>
<style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a}
.c{max-width:26rem;padding:2rem;text-align:center}h1{font-size:1.25rem}p{color:#475569;line-height:1.5}
a,button{display:inline-block;margin:.25rem;padding:.5rem 1rem;border-radius:.375rem;border:1px solid #cbd5e1;background:#fff;color:#0f172a;text-decoration:none;font:inherit;cursor:pointer}</style></head>
<body><div class="c"><h1>You're offline</h1>
<p>This page hasn't been saved for offline use on this device yet. Open a page you've used before, or reconnect and try again.</p>
<a href="/dashboard">Open Dashboard</a><button onclick="location.reload()">Try again</button></div></body></html>
